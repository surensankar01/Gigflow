version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: gigflow-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: gigflow
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - gigflow-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gigflow-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/gigflow
    ports:
      - '5000:5000'
    depends_on:
      - mongodb
    networks:
      - gigflow-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gigflow-frontend
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      - backend
    networks:
      - gigflow-network

volumes:
  mongo_data:

networks:
  gigflow-network:
    driver: bridge
